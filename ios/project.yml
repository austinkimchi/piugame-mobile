name: MyPIU

options:
  bundleIdPrefix: com.austinkimchi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MyPIU:
    type: application
    platform: iOS
    sources:
      - path: MyPIU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinkimchi.mypiu
        PRODUCT_NAME: MyPIU
        INFOPLIST_FILE: MyPIU/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SwiftSoup
      - target: MyPIUSafariExtension
        embed: true
    scheme:
      testTargets:
        - MyPIUTests

  MyPIUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyPIUTests
    dependencies:
      - target: MyPIU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinkimchi.mypiu.tests
        GENERATE_INFOPLIST_FILE: YES

  MyPIUSafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MyPIUSafariExtension/SafariWebExtensionHandler.swift
      - path: MyPIUSafariExtension/Resources/manifest.json
        buildPhase: resources
      - path: MyPIUSafariExtension/Resources/assets
        type: folder
        buildPhase: resources
      - path: MyPIUSafariExtension/Resources/src
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinkimchi.mypiu.safari
        PRODUCT_NAME: MyPIU Sync Extension
        INFOPLIST_FILE: MyPIUSafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
