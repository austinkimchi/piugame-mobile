name: MyPIU

options:
  bundleIdPrefix: com.austinkimchi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MyPIU:
    type: application
    platform: iOS
    sources:
      - path: MyPIU
    info:
      path: MyPIU/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinkimchi.mypiu
        PRODUCT_NAME: MyPIU
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SwiftSoup
    scheme:
      testTargets:
        - MyPIUTests

  MyPIUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyPIUTests
    dependencies:
      - target: MyPIU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinkimchi.mypiu.tests
        GENERATE_INFOPLIST_FILE: YES
