<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MyPIU Sync</title>
    <style>
      body { width: 260px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; color: #161719; background: #f7f8f5; }
      h1 { margin: 0 0 12px; font-size: 17px; }
      button { width: 100%; min-height: 40px; border: 0; border-radius: 6px; color: white; background: #d33032; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      p { min-height: 40px; margin: 12px 0 0; color: #51554e; }
    </style>
  </head>
  <body>
    <h1>MyPIU Sync</h1>
    <button id="sync" type="button">Read PIUGAME now</button>
    <p id="status" role="status">Open MyPIU before starting.</p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
