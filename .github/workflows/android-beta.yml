name: Android beta bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Public version name, such as 0.1.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Play version code
        required: true
        type: number

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: android-beta
    defaults:
      run:
        working-directory: android
    env:
      MYPIU_VERSION_NAME: ${{ inputs.version_name }}
      MYPIU_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 16111833
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: android sdk install --no-metrics "platforms/android-37.0" "build-tools/36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MYPIU_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo "version_name must be a semantic version such as 0.1.0" >&2
            exit 1
          }
          [[ "$MYPIU_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }
      - name: Restore and verify upload key
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for value in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD EXPECTED_CERT_SHA256; do
            [[ -n "${!value:-}" ]] || {
              echo "Required Android beta secret $value is missing" >&2
              exit 1
            }
          done

          umask 077
          keystore="$RUNNER_TEMP/mypiu-upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          actual_fingerprint=$(
            keytool -list -v \
              -keystore "$keystore" \
              -storepass "$UPLOAD_STORE_PASSWORD" \
              -alias "$UPLOAD_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )
          expected_fingerprint=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          [[ -n "$actual_fingerprint" && "$actual_fingerprint" == "$expected_fingerprint" ]] || {
            echo "The restored upload certificate does not match ANDROID_UPLOAD_CERT_SHA256" >&2
            exit 1
          }

          echo "MYPIU_UPLOAD_STORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Test, lint, and build signed bundle
        env:
          MYPIU_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          MYPIU_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          MYPIU_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease bundleRelease --no-parallel --stacktrace
      - name: Verify bundle signature
        shell: bash
        run: |
          set -euo pipefail
          bundle="app/build/outputs/bundle/release/app-release.aab"
          [[ -s "$bundle" ]] || {
            echo "Release bundle was not produced" >&2
            exit 1
          }
          verification=$(jarsigner -verify "$bundle" 2>&1)
          grep -Fq "jar verified." <<< "$verification"
          echo "Bundle signature verified."
          bundle_directory=$(dirname "$bundle")
          bundle_name=$(basename "$bundle")
          (
            cd "$bundle_directory"
            sha256sum "$bundle_name" > "$bundle_name.sha256"
          )
      - name: Upload signed beta bundle
        uses: actions/upload-artifact@v4
        with:
          name: mypiu-android-beta-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove upload key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mypiu-upload.jks"
