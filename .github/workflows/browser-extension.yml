name: Browser extension

on:
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - '.github/workflows/browser-extension.yml'
      - '.github/workflows/browser-extension-release.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'browser-extension/**'
      - '.github/workflows/browser-extension.yml'
      - '.github/workflows/browser-extension-release.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:syntax
      - name: Package Chromium extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: mypiu-sync-chromium-${{ github.sha }}
          path: |
            browser-extension/dist/*.zip
            browser-extension/dist/*.sha256
          if-no-files-found: error
          retention-days: 7
