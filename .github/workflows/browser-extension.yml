name: Browser extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        run: find src test scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Package Chromium extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: mypiu-sync-chromium-${{ github.sha }}
          path: |
            browser-extension/dist/*.zip
            browser-extension/dist/*.sha256
          if-no-files-found: error
          retention-days: 30
