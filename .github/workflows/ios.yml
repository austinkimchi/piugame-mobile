name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'test-fixtures/**'
      - 'browser-extension/**'
      - 'scripts/*ios*.sh'
      - 'scripts/prepare-app-store-connect-key.sh'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-testflight.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'ios/**'
      - 'test-fixtures/**'
      - 'browser-extension/**'
      - 'scripts/*ios*.sh'
      - 'scripts/prepare-app-store-connect-key.sh'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-testflight.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Validate App Store metadata
        run: ./scripts/verify-ios-store-metadata.sh
      - name: Test iOS release helpers
        run: ./scripts/test-ios-release-helpers.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and Safari resources
        run: ./scripts/generate-ios-project.sh
      - name: Verify checked-in Xcode artifacts are current
        run: git diff --exit-code -- ios/MyPIU.xcodeproj ios/MyPIUSafariExtension/Resources
      - name: Build for simulator
        working-directory: ios
        run: >-
          xcodebuild
          -project MyPIU.xcodeproj
          -scheme MyPIU
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/MyPIUDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify embedded Safari extension
        run: |
          APPEX="$(find "$RUNNER_TEMP/MyPIUDerivedData/Build/Products" -path '*/MyPIU.app/PlugIns/*.appex' -print -quit)"
          test -n "$APPEX"
          test -f "$APPEX/manifest.json"
          test -f "$APPEX/src/service-worker.js"
          python3 - "$APPEX/manifest.json" "$APPEX/Info.plist" <<'PY'
          import json
          import pathlib
          import plistlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert manifest["manifest_version"] == 3
          assert manifest["background"] == {"service_worker": "src/service-worker.js"}

          with pathlib.Path(sys.argv[2]).open("rb") as plist_file:
              extension_info = plistlib.load(plist_file)["NSExtension"]
          assert extension_info["NSExtensionPointIdentifier"] == "com.apple.Safari.web-extension"
          assert extension_info["NSExtensionPrincipalClass"].endswith(".SafariWebExtensionHandler")
          PY
          ! grep -Eq '^[[:space:]]*import[[:space:]]' "$APPEX/src/service-worker.js"
      - name: Read release version
        id: release_version
        working-directory: ios
        run: |
          xcodebuild \
            -project MyPIU.xcodeproj \
            -scheme MyPIU \
            -configuration Release \
            -showBuildSettings \
            -json > "$RUNNER_TEMP/mypiu-release-settings.json"
          MARKETING_VERSION="$(jq -er '.[] | select(.target == "MyPIU") | .buildSettings.MARKETING_VERSION' "$RUNNER_TEMP/mypiu-release-settings.json")"
          BUILD_NUMBER="$(jq -er '.[] | select(.target == "MyPIU") | .buildSettings.CURRENT_PROJECT_VERSION' "$RUNNER_TEMP/mypiu-release-settings.json")"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$MARKETING_VERSION"
          grep -Eq '^[1-9][0-9]*$' <<< "$BUILD_NUMBER"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Archive unsigned iOS release
        working-directory: ios
        run: >-
          xcodebuild
          -project MyPIU.xcodeproj
          -scheme MyPIU
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/MyPIU.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/MyPIUArchiveDerivedData"
          CODE_SIGNING_ALLOWED=NO
          archive
      - name: Verify iOS release archive
        run: >-
          ./scripts/verify-ios-archive.sh
          "$RUNNER_TEMP/MyPIU.xcarchive"
          "${{ steps.release_version.outputs.marketing_version }}"
          "${{ steps.release_version.outputs.build_number }}"
      - name: Run tests
        working-directory: ios
        run: |
          DEVICE_ID="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          print(next(
              device["udid"]
              for runtime in devices.values()
              for device in runtime
              if device["isAvailable"] and device["name"].startswith("iPhone")
          ))
          PY
          )"
          xcodebuild \
            -project MyPIU.xcodeproj \
            -scheme MyPIU \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Package iOS release archive
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent MyPIU.xcarchive MyPIU.xcarchive.zip
          test -s MyPIU.xcarchive.zip
          shasum -a 256 MyPIU.xcarchive.zip > MyPIU.xcarchive.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mypiu-ios-unsigned-archive-${{ github.sha }}
          path: |
            ${{ runner.temp }}/MyPIU.xcarchive.zip
            ${{ runner.temp }}/MyPIU.xcarchive.zip.sha256
          if-no-files-found: error
          retention-days: 7
