name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and Safari resources
        run: ./scripts/generate-ios-project.sh
      - name: Build for simulator
        working-directory: ios
        run: >-
          xcodebuild
          -project MyPIU.xcodeproj
          -scheme MyPIU
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/MyPIUDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify embedded Safari extension
        run: |
          APPEX="$(find "$RUNNER_TEMP/MyPIUDerivedData/Build/Products" -path '*/MyPIU.app/PlugIns/*.appex' -print -quit)"
          test -n "$APPEX"
          test -f "$APPEX/manifest.json"
          test -f "$APPEX/src/service-worker.js"
          python3 - "$APPEX/manifest.json" "$APPEX/Info.plist" <<'PY'
          import json
          import pathlib
          import plistlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert manifest["manifest_version"] == 3
          assert manifest["background"] == {"service_worker": "src/service-worker.js"}

          with pathlib.Path(sys.argv[2]).open("rb") as plist_file:
              extension_info = plistlib.load(plist_file)["NSExtension"]
          assert extension_info["NSExtensionPointIdentifier"] == "com.apple.Safari.web-extension"
          assert extension_info["NSExtensionPrincipalClass"].endswith(".SafariWebExtensionHandler")
          PY
          ! grep -Eq '^[[:space:]]*import[[:space:]]' "$APPEX/src/service-worker.js"
      - name: Run tests
        working-directory: ios
        run: |
          DEVICE_ID="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          print(next(
              device["udid"]
              for runtime in devices.values()
              for device in runtime
              if device["isAvailable"] and device["name"].startswith("iPhone")
          ))
          PY
          )"
          xcodebuild \
            -project MyPIU.xcodeproj \
            -scheme MyPIU \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
