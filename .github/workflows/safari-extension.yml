name: Safari extension

on:
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - 'scripts/generate-macos-safari-project.sh'
      - '.github/workflows/safari-extension.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'browser-extension/**'
      - 'scripts/generate-macos-safari-project.sh'
      - '.github/workflows/safari-extension.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install extension dependencies
        working-directory: browser-extension
        run: npm ci
      - name: Test shared extension runtime
        working-directory: browser-extension
        run: |
          npm test
          npm run check:syntax
      - name: Package Safari extension project
        id: package
        env:
          SKIP_NPM_CI: 1
        run: |
          ./scripts/generate-macos-safari-project.sh

          PROJECT="$(find browser-extension/dist/safari-project -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          RESOURCES="$(find browser-extension/dist/safari-project -type d -path '*/Shared (Extension)/Resources' -print -quit)"
          test -n "$RESOURCES"
          diff -qr browser-extension/dist/safari-mv3 "$RESOURCES"
      - name: Verify generated schemes
        env:
          PROJECT: ${{ steps.package.outputs.project }}
        run: |
          xcodebuild -project "$PROJECT" -list -json > "$RUNNER_TEMP/safari-project.json"
          jq -e '.project.schemes | index("MyPIU Sync (iOS)") != null' "$RUNNER_TEMP/safari-project.json"
          jq -e '.project.schemes | index("MyPIU Sync (macOS)") != null' "$RUNNER_TEMP/safari-project.json"
      - name: Build iOS Safari wrapper
        env:
          PROJECT: ${{ steps.package.outputs.project }}
        run: >-
          xcodebuild
          -project "$PROJECT"
          -scheme "MyPIU Sync (iOS)"
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Archive macOS Safari wrapper
        env:
          PROJECT: ${{ steps.package.outputs.project }}
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "MyPIU Sync (macOS)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/MyPIUSync.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Verify macOS release archive
        run: |
          APP="$RUNNER_TEMP/MyPIUSync.xcarchive/Products/Applications/MyPIU Sync.app"
          APPEX="$(find "$APP/Contents/PlugIns" -name '*.appex' -print -quit)"
          MANIFEST="$(find "$APPEX" -name manifest.json -print -quit)"
          test -d "$APP"
          test -n "$APPEX"
          test -n "$MANIFEST"
          test -f "$(dirname "$MANIFEST")/src/service-worker.js"
          python3 - "$APP/Contents/Info.plist" "$APPEX/Contents/Info.plist" "$MANIFEST" <<'PY'
          import json
          import pathlib
          import plistlib
          import sys

          with pathlib.Path(sys.argv[1]).open("rb") as plist_file:
              app_info = plistlib.load(plist_file)
          with pathlib.Path(sys.argv[2]).open("rb") as plist_file:
              extension_info = plistlib.load(plist_file)
          manifest = json.loads(pathlib.Path(sys.argv[3]).read_text())

          assert app_info["CFBundleIdentifier"] == "com.austinkimchi.mypiu.sync"
          assert extension_info["CFBundleIdentifier"] == "com.austinkimchi.mypiu.sync.Extension"
          assert extension_info["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.Safari.web-extension"
          assert manifest["manifest_version"] == 3
          assert manifest["background"] == {"service_worker": "src/service-worker.js"}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mypiu-safari-project-${{ github.sha }}
          path: browser-extension/dist/safari-project
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mypiu-macos-unsigned-archive-${{ github.sha }}
          path: ${{ runner.temp }}/MyPIUSync.xcarchive
          if-no-files-found: error
          retention-days: 7
